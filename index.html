<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Usuário</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #222;
      text-align: center;
    }
    main {
      max-width: 440px;
      margin: auto;
    }
    video {
      width: 100%;
      border-radius: 14px;
      background: #111;
      transform: scaleX(-1);
    }
    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 17px;
    }
    button:disabled {
      background: #999;
    }
    #status {
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h2>Registro de Usuário</h2>
    <p>Posicione seu rosto na câmera.</p>

    <video id="camera" autoplay playsinline muted></video>

    <button id="iniciar" onclick="iniciarCamera()">
      Ativar câmera
    </button>

    <button id="registrar" onclick="registrar()" disabled>
      Tirar selfie e registrar
    </button>

    <p id="status">Aguardando ativação da câmera.</p>
    <p>
      Ao registrar, você autoriza o envio da selfie
      e das coordenadas da sua localização.
    </p>

    <form id="formulario" method="POST" style="display:none">
      <input type="hidden" name="foto" id="foto">
      <input type="hidden" name="latitude" id="latitude">
      <input type="hidden" name="longitude" id="longitude">
    </form>
  </main>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzD_5KAG9p15OjSej4FiUJbEXs0pUX5b4TLr9Wh3wX6ex4AEsV5KSGiFQfzBqyswE3Hpw/exec";

    const camera = document.getElementById("camera");
    const statusEl = document.getElementById("status");
    const registrarBtn = document.getElementById("registrar");

    document.getElementById("formulario").action =
      APPS_SCRIPT_URL;

    async function iniciarCamera() {
      try {
        statusEl.textContent = "Solicitando câmera...";

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
          });

        camera.srcObject = stream;
        await camera.play();

        registrarBtn.disabled = false;
        statusEl.textContent = "Câmera pronta!";
      } catch (erro) {
        statusEl.textContent =
          "Não foi possível acessar a câmera: " + erro.message;
      }
    }

    function obterLocalizacao() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          posicao => resolve(posicao.coords),
          reject,
          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
          }
        );
      });
    }

    async function registrar() {
      registrarBtn.disabled = true;

      try {
        statusEl.textContent = "Obtendo localização...";

        const local = await obterLocalizacao();

        if (!camera.videoWidth) {
          throw new Error("Câmera ainda não está pronta.");
        }

        const canvas = document.createElement("canvas");

        canvas.width = 640;
        canvas.height = Math.round(
          camera.videoHeight * 640 / camera.videoWidth
        );

        canvas.getContext("2d").drawImage(
          camera,
          0, 0,
          canvas.width, canvas.height
        );

        document.getElementById("foto").value =
          canvas.toDataURL("image/jpeg", 0.7);

        document.getElementById("latitude").value =
          local.latitude;

        document.getElementById("longitude").value =
          local.longitude;

        statusEl.textContent =
          "Enviando registro. Aguarde a página de confirmação...";

        // Envia por navegação normal, sem fetch/CORS.
        document.getElementById("formulario").submit();

      } catch (erro) {
        statusEl.textContent = "Erro: " + erro.message;
        registrarBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
